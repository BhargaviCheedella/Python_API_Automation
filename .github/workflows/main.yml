name: Python API Tests with MySQL (CI/CD)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: rootpassword
  DB_NAME: api_testing_db

jobs:
  # ---------------------------- CI ----------------------------
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytest mysql-connector-python python-dotenv pytest-html

      - name: Start MySQL (preinstalled on runner)
        run: |
          sudo systemctl start mysql.service
          # Wait until MySQL accepts connections (default runner root password is "root")
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is up"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Configure MySQL root password and database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${DB_PASSWORD}';
            FLUSH PRIVILEGES;
            CREATE DATABASE IF NOT EXISTS ${DB_NAME};
          "

      - name: Initialize database schema
        run: |
          if [ -f sql/init.sql ]; then
            mysql -h 127.0.0.1 -u"${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" < sql/init.sql
          else
            echo "sql/init.sql not found, skipping"
          fi

      - name: Run API tests
        run: |
          python -m pytest -v --html=report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report.html
          if-no-files-found: warn

  # ---------------------------- CD ----------------------------
  deploy:
    needs: api-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying application..."
          # Replace with your real deploy step, e.g.:
          # ssh user@server "cd /app && git pull && systemctl restart api"
